services:
  cloudpc:
    build:
      context: .
    image: cloudpc-console:local
    init: true
    restart: unless-stopped
    ports:
      - "0.0.0.0:${CLOUDPC_PORT:-8766}:8765"
    environment:
      CLOUDPC_DATA_DIR: /data
      CLOUDPC_PUBLIC_PORT: "${CLOUDPC_PORT:-8766}"
      CLOUDPC_PUBLIC_ORIGINS: "${CLOUDPC_PUBLIC_ORIGINS:-}"
    volumes:
      - cloudpc-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 330s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cloudpc-data:
