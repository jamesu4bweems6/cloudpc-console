services:
  cloudpc:
    build:
      context: .
    image: cloudpc-console:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CLOUDPC_PORT:-8766}:8765"
    environment:
      CLOUDPC_DATA_DIR: /data
      CLOUDPC_PUBLIC_ORIGINS: "http://127.0.0.1:${CLOUDPC_PORT:-8766},http://localhost:${CLOUDPC_PORT:-8766}"
    volumes:
      - cloudpc-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cloudpc-data:
